; Custom RX: ESP32-S3 + 2x E80-900M2213S (LR1121) True Diversity / Gemini / GemX
; Monorepo env: e80_esp32s3_td_rx

[env:e80_esp32s3_td_rx_via_UART]
extends = env_common_esp32s3rx, radio_LR1121
board = esp32-s3-devkitc-1
build_flags =
	${env_common_esp32s3rx.build_flags}
	${radio_LR1121.build_flags}
	-D TARGET_E80_ESP32S3_TD_RX
	-D DEBUG_LOG
monitor_speed = 460800
upload_speed = 921600

[env:e80_esp32s3_td_rx_via_WIFI]
extends = env:e80_esp32s3_td_rx_via_UART

[env:e80_esp32s3_td_rx_via_BetaflightPassthrough]
extends = env:e80_esp32s3_td_rx_via_UART

[env:e80_esp32s3_td_rx]
extends = env:e80_esp32s3_td_rx_via_UART
