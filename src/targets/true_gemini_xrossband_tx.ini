; Custom TX: ESP32-S3 DevKitC N16R8 + 2x E80-900M2213S (True Gemini Xrossband handset)
; Monorepo env: true_gemini_xrossband_tx
; Layout SoT: custom-targets/true_gemini_xrossband_tx/hardware.json
;   → targets/layouts/TrueGeminiXrossband.json
; Flash: native USB (GPIO19/20). Do not use UART0 silk TX/RX for debug.
; hardware.json embed: set board_config after hardware/targets clone, or upload JSON via WiFi UI.
;   See custom-targets/true_gemini_xrossband_tx/README.md

[env:true_gemini_xrossband_tx_via_UART]
extends = env_common_esp32s3tx, radio_LR1121
board = esp32-s3-devkitc-1
build_flags =
	${env_common_esp32s3tx.build_flags}
	${radio_LR1121.build_flags}
	-D TARGET_TRUE_GEMINI_XROSSBAND_TX
	-D DEBUG_LOG
monitor_speed = 460800
upload_speed = 921600
; Optional after targets clone + merge:
; board_config = diy.tx_true_gemini.xrossband

[env:true_gemini_xrossband_tx_via_WIFI]
extends = env:true_gemini_xrossband_tx_via_UART

[env:true_gemini_xrossband_tx]
extends = env:true_gemini_xrossband_tx_via_UART
